<title>バイト勤務記録</title>
<style>
  :root{
    --bg:#f2f5f4; --card:#ffffff; --card2:#eef4f2; --ink:#16211f; --muted:#5c6d6a;
    --line:#dce5e2; --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e0f2ef;
    --warn:#b45309; --warn-soft:#fdf0dd; --danger:#b42318; --danger-soft:#fdecea;
    --money:#8a5a00; --money-soft:#fdf3d7;
    --shadow:0 1px 2px rgba(16,40,36,.06),0 8px 24px -12px rgba(16,40,36,.18);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1514; --card:#16201e; --card2:#1b2926; --ink:#e7efed; --muted:#9db3ae;
      --line:#2a3a37; --accent:#2dd4bf; --accent-ink:#06231f; --accent-soft:#123832;
      --warn:#f0b35e; --warn-soft:#3a2a12; --danger:#ff9a8f; --danger-soft:#3d1a16;
      --money:#f2cd72; --money-soft:#38300f;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    line-height:1.55;padding:0 0 calc(40px + env(safe-area-inset-bottom));}
  button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:44px}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:var(--ink)}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 0}

  .today{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 2px 12px}
  .today .d{font-size:15px;font-weight:700;letter-spacing:.02em}
  .today .clock{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800}
  .today .clock small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-align:right;letter-spacing:.08em}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--muted);letter-spacing:.1em;font-weight:700}
  label.flabel{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px}
  .field{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px}
  .field:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .field.invalid{border-color:var(--danger);background:var(--danger-soft)}
  .field.invalid:focus{outline-color:var(--danger);border-color:var(--danger)}
  .time-hint{grid-column:1/-1;font-size:12px;color:var(--muted);margin:-4px 0 0;line-height:1.5}
  textarea.field{resize:vertical;min-height:44px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);font-weight:700;font-size:15px;padding:10px 16px;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.big{width:100%;font-size:19px;padding:16px;border-radius:13px;letter-spacing:.04em}
  .btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
  .btn.danger-ghost{background:transparent;border-color:transparent;color:var(--danger)}
  .btn.small{min-height:38px;padding:6px 12px;font-size:13.5px;border-radius:9px}
  .btn:disabled{opacity:.45;cursor:default}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap}
  .btnrow .btn{flex:1 1 140px}

  /* 勤務中 */
  .live-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .live-badge{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);
    font-weight:800;font-size:13px;border-radius:999px;padding:5px 12px}
  .live-badge .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
  .live-badge.onbreak{background:var(--warn-soft);color:var(--warn)}
  .live-badge.onbreak .dot{background:var(--warn);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion: reduce){.live-badge .dot{animation:none}}
  .live-place{font-size:15px;font-weight:700;margin-top:4px;word-break:break-all}
  .live-place:empty{display:none}
  .timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:800;letter-spacing:.01em;line-height:1.15;margin:10px 0 2px}
  .timer-label{font-size:12.5px;color:var(--muted);font-weight:600}
  .live-meta{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 16px;padding-top:12px;border-top:1px dashed var(--line)}
  .live-meta div b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .live-meta div span{font-size:11.5px;color:var(--muted);font-weight:600}

  /* 設定 */
  .setgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .setnote{font-size:12.5px;color:var(--muted);margin:10px 0 0}
  .yen-wrap{position:relative}
  .yen-wrap .field{padding-left:28px}
  .yen-wrap::before{content:"¥";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
  .update-box{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .update-box .btn{width:100%}
  .update-note{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.6}
  .update-note b{color:var(--ink)}

  /* 月サマリー */
  .monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
  .monthnav .m{font-size:18px;font-weight:800}
  .monthnav button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:17px;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .monthnav button:disabled{opacity:.35}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--card2);border-radius:11px;padding:12px 10px;text-align:center}
  .stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.3}
  .stat b.money{color:var(--money)}
  .stat span{font-size:11.5px;color:var(--muted);font-weight:700}
  .stat .sub{display:block;font-size:11px;color:var(--muted);font-weight:600}
  .csvrow{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .csvrow .btn{width:100%}
  /* 数字入力：ステッパーを消してタイピング専用に見せる（キーボードは inputmode で数字に） */
  input[type="number"]{-moz-appearance:textfield;appearance:textfield}
  input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  /* 印刷／PDF専用（画面では非表示） */
  .print-only{display:none}
  @page{size:A4 landscape;margin:12mm}
  @media print{
    body{background:#fff!important;color:#000!important;padding:0!important}
    .wrap,.overlay,.toast{display:none!important}
    .print-only{display:block!important;color:#000;background:#fff;font-size:12px;line-height:1.45}
    .print-only h1{font-size:20px;margin:0 0 4px;letter-spacing:.02em}
    .print-only .p-meta{font-size:11px;color:#444;margin:0 0 10px}
    .print-summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
    .print-summary div{border:1px solid #bbb;border-radius:8px;padding:8px 12px;min-width:150px}
    .print-summary span{display:block;font-size:11px;color:#555;font-weight:700}
    .print-summary b{font-size:16px;font-variant-numeric:tabular-nums}
    .print-table{width:100%;border-collapse:collapse;table-layout:auto}
    .print-table th,.print-table td{border:1px solid #999;padding:5px 6px;vertical-align:top;word-break:break-word}
    .print-table th{background:#eef4f2!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:11px;text-align:left;white-space:nowrap}
    .print-table td{font-size:11.5px}
    .print-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    .print-table .center{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
    .print-table tfoot td{font-weight:800;background:#f7f7f7
