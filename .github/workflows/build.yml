name: Build Baito IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [baito-ios.zip]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q baito-ios.zip -d baito
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        working-directory: baito
        run: |
          xcodegen generate
          xcodebuild -project Baito.xcodeproj -target Baito \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Release-iphoneos/Baito.app Payload/
          zip -qr ../Baito.ipa Payload
      - name: Publish IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Baito.ipa --title "バイト時間 最新版" --notes "自動ビルド"
